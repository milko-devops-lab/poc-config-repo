apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-api-test
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/milko-devops-lab/poc-config-repo.git'
    targetRevision: HEAD
    path: helm/claims-api
    helm:
      valueFiles:
        - values.yaml
        - values-test.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: claims-api-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true