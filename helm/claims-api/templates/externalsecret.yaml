apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "claims-api.name" . }}-vault-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "claims-api.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: claims-api-secret
    creationPolicy: Owner
  data:
    - secretKey: ConnectionString
      remoteRef:
        key: claims-api/{{ .Values.env.vaultEnvPath | default "dev" }}
        property: ConnectionString