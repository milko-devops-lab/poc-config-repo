apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "claims-api.name" . }}
  labels:
    {{- include "claims-api.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: claims.local  # access it on this domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "claims-api.name" . }}
                port:
                  number: {{ .Values.service.port }}