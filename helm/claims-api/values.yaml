replicaCount: 1

image:
  repository: ghcr.io/milko-devops-lab/claims-api
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "claims-api-sa"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  LOG_LEVEL: "Information"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL